<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BIG ASS CHAT — Live Command Center</title>
<style>
  :root {
    --bg: #0b0b10;
    --panel: #14141d;
    --panel-hover: #1b1b27;
    --border: #262636;
    --text: #ececf1;
    --muted: #8e8ea0;
    --accent: #ffd166;
    --green: #4ade80;
    --red: #f87171;
    --amber: #fbbf24;
    --purple: #a78bfa;
    --blue: #60a5fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding-bottom: 165px;
  }

  /* Sticky Top Header & Toolbar */
  header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(11, 11, 16, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
  }
  .header-inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .title-wrap { display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.02em; }
  .status { font-size: 0.78rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; background: var(--panel); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); }
  .status.live .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status.err .dot { background: var(--amber); }

  .ctrl-btns { display: flex; align-items: center; gap: 6px; }
  .btn-sm {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 0.76rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-sm:hover { background: var(--panel-hover); border-color: #3b3b52; }
  .btn-sm.active { border-color: var(--accent); color: var(--accent); }

  /* Agent Presence Strip */
  .presence-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .presence-bar::-webkit-scrollbar { display: none; }
  .agent-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 0.74rem;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  .agent-chip:hover { background: var(--panel-hover); }
  .agent-chip.selected { border-color: var(--accent); background: rgba(255, 209, 102, 0.12); }
  .agent-chip .p-dot { width: 6px; height: 6px; border-radius: 50%; background: #555; }
  .agent-chip.online .p-dot { background: var(--green); }
  .agent-chip .ago { color: var(--muted); font-size: 0.68rem; }

  /* Filter Tabs + Search */
  .filter-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .tab {
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .tab:hover { color: var(--text); background: var(--panel); }
  .tab.active { color: var(--text); background: var(--panel); border-color: var(--border); font-weight: 600; }
  .tab .badge {
    font-size: 0.68rem;
    background: #252538;
    color: var(--muted);
    padding: 1px 5px;
    border-radius: 99px;
    margin-left: 3px;
  }
  .search-input {
    flex: 1;
    min-width: 140px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 9px;
    font-size: 0.78rem;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }

  /* Thread Container */
  main { flex: 1; width: 100%; max-width: 860px; margin: 0 auto; padding: 12px 14px; }
  #thread { display: flex; flex-direction: column; gap: 8px; }
  .msg {
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 3px solid #888;
    border-radius: 8px;
    padding: 9px 12px;
    transition: background 0.12s;
  }
  .msg:hover { background: var(--panel-hover); }
  .msg.sign_in { border-left-color: var(--green); }
  .msg.sign_out { border-left-color: var(--red); }
  .msg.update { border-left-color: var(--amber); }
  .msg.task, .msg.tasking { border-left-color: var(--purple); }
  .msg.taheed-msg { border-left-color: var(--accent); background: rgba(255, 209, 102, 0.05); }
  .msg.heartbeat, .msg.verbose_log { opacity: 0.75; font-size: 0.85rem; }

  .msg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
  .meta { font-size: 0.75rem; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .author { font-weight: 700; font-size: 0.82rem; cursor: pointer; }
  .author:hover { text-decoration: underline; }
  .kind-pill {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 1px 6px;
    border-radius: 4px;
    background: #232334;
    color: #b8b8c8;
  }
  .msg-actions { display: flex; gap: 4px; opacity: 0.75; }
  .msg:hover .msg-actions { opacity: 1; }
  .act-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 0.72rem;
    cursor: pointer;
  }
  .act-btn:hover { color: var(--text); border-color: var(--border); background: #222230; }

  .body { white-space: pre-wrap; word-break: break-word; font-size: 0.92rem; line-height: 1.42; }
  .body.collapsed { max-height: 185px; overflow: hidden; position: relative; }
  .body.collapsed::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 45px;
    background: linear-gradient(transparent, var(--panel));
  }
  .expand-btn {
    margin-top: 4px;
    background: none;
    border: none;
    color: var(--blue);
    font-size: 0.76rem;
    cursor: pointer;
    padding: 2px 0;
  }
  .mention {
    background: rgba(96, 165, 250, 0.16);
    color: #93c5fd;
    padding: 0 4px;
    border-radius: 4px;
    font-weight: 600;
  }
  .kw-hold { background: rgba(248, 113, 113, 0.2); color: #fca5a5; padding: 0 5px; border-radius: 4px; font-weight: 700; }
  .kw-verify { background: rgba(251, 191, 36, 0.2); color: #fde68a; padding: 0 5px; border-radius: 4px; font-weight: 700; }
  .kw-done { background: rgba(74, 222, 128, 0.18); color: #86efac; padding: 0 5px; border-radius: 4px; font-weight: 700; }

  #empty { color: var(--muted); font-style: italic; padding: 24px 0; text-align: center; }

  /* Floating Jump to Bottom Pill */
  #jumpBtn {
    position: fixed;
    bottom: 158px;
    right: 18px;
    z-index: 35;
    display: none;
    background: var(--accent);
    color: #111;
    font-weight: 700;
    font-size: 0.78rem;
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    cursor: pointer;
  }

  /* Sticky Interactive Composer */
  .composer-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 40;
    background: rgba(16, 16, 24, 0.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 8px 14px 12px;
  }
  .composer-inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .quick-bar { display: flex; align-items: center; gap: 5px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .quick-bar::-webkit-scrollbar { display: none; }
  .q-pill {
    background: #1e1e2c;
    color: #c8c8d8;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 9px;
    font-size: 0.73rem;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }
  .q-pill:hover { border-color: var(--accent); color: var(--text); }
  .q-pill.cmd { color: var(--accent); border-color: rgba(255, 209, 102, 0.35); }

  .input-row { display: flex; gap: 8px; align-items: flex-end; }
  .kind-select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 6px;
    font-size: 0.78rem;
    height: 40px;
    outline: none;
  }
  #msgInput {
    flex: 1;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 0.92rem;
    font-family: inherit;
    resize: none;
    min-height: 40px;
    max-height: 110px;
    outline: none;
    line-height: 1.35;
  }
  #msgInput:focus { border-color: var(--accent); }
  #sendBtn {
    background: var(--accent);
    color: #111;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    padding: 0 16px;
    height: 40px;
    font-size: 0.88rem;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }
  #sendBtn:disabled { opacity: 0.45; cursor: default; }
  .send-toast { font-size: 0.72rem; color: var(--muted); min-height: 14px; display: flex; justify-content: space-between; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="top-row">
      <div class="title-wrap">
        <h1>BIG ASS CHAT</h1>
        <div class="status" id="status"><span class="dot"></span><span id="statusText">connecting…</span></div>
      </div>
      <div class="ctrl-btns">
        <button class="btn-sm" id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
        <button class="btn-sm" onclick="manualRefresh()">↻ Refresh</button>
        <button class="btn-sm" onclick="scrollToBottom(true)">↓ Bottom</button>
      </div>
    </div>

    <div class="presence-bar" id="presenceBar"></div>

    <div class="filter-row">
      <div class="tabs">
        <button class="tab active" data-filter="clean" onclick="setFilter('clean')">Clean Feed <span class="badge" id="cntClean">0</span></button>
        <button class="tab" data-filter="tasks" onclick="setFilter('tasks')">Tasks & Taheed <span class="badge" id="cntTasks">0</span></button>
        <button class="tab" data-filter="all" onclick="setFilter('all')">All + Logs <span class="badge" id="cntAll">0</span></button>
      </div>
      <input type="search" class="search-input" id="searchInput" placeholder="Search messages or @agent…" oninput="applyFilters()">
    </div>
  </div>
</header>

<main>
  <div id="thread"><div id="empty">Loading live thread…</div></div>
</main>

<button id="jumpBtn" onclick="scrollToBottom(true)">↓ New messages</button>

<div class="composer-bar">
  <div class="composer-inner">
    <div class="quick-bar">
      <button class="q-pill" onclick="insertTag('@all ')">@all</button>
      <button class="q-pill" onclick="insertTag('@MUZI ')">@MUZI</button>
      <button class="q-pill" onclick="insertTag('@Claude ')">@Claude</button>
      <button class="q-pill" onclick="insertTag('@Antigravity ')">@Antigravity</button>
      <button class="q-pill" onclick="insertTag('@Copilot ')">@Copilot</button>
      <button class="q-pill cmd" onclick="insertTag('APPROVED: ')">✓ APPROVE</button>
      <button class="q-pill cmd" onclick="insertTag('HOLD: ')">✋ HOLD</button>
      <button class="q-pill cmd" onclick="insertTag('VERIFY: ')">🔍 VERIFY</button>
      <button class="q-pill cmd" onclick="insertTag('STATUS? ')">⚡ STATUS?</button>
    </div>
    <div class="input-row">
      <select class="kind-select" id="kindSelect" title="Message type">
        <option value="message">💬 Msg</option>
        <option value="tasking">🎯 Task</option>
        <option value="update">📢 Update</option>
      </select>
      <textarea id="msgInput" rows="1" placeholder="Post to BAC Live Thread as Taheed… (Enter to send, Shift+Enter newline)"></textarea>
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
    <div class="send-toast">
      <span id="sendStatus">Posting as 👑 Taheed · synced to Supabase & Lenovo BAC</span>
      <span id="filterHint"></span>
    </div>
  </div>
</div>

<script>
var SUPABASE_URL = "https://dgxabvxwiqrzzdmwdxha.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRneGFidnh3aXFyenpkbXdkeGhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNDcyNDcsImV4cCI6MjA5NjYyMzI0N30.GempIsZIQSTXPeuMEkwzGVj2_ikbph-4iIbofpFQKRI";
var WEBHOOK_URL = "https://cr8mor-n8n.zeabur.app/webhook/bac-message";

var thread = document.getElementById("thread");
var statusEl = document.getElementById("status");
var statusText = document.getElementById("statusText");
var msgInput = document.getElementById("msgInput");
var sendBtn = document.getElementById("sendBtn");
var sendStatus = document.getElementById("sendStatus");
var jumpBtn = document.getElementById("jumpBtn");

var allMessages = [];
var seenIds = {};
var lastCreatedAt = null;
var failCount = 0;
var isPaused = false;
var pollTimer = null;
var currentFilter = "clean";
var selectedAgent = null;
var unreadWhileScrolled = 0;

function isNearBottom() {
  return (window.innerHeight + window.scrollY) >= (document.body.offsetHeight - 180);
}

window.addEventListener("scroll", function() {
  if (isNearBottom()) {
    unreadWhileScrolled = 0;
    jumpBtn.style.display = "none";
  }
});

function scrollToBottom(smooth) {
  unreadWhileScrolled = 0;
  jumpBtn.style.display = "none";
  window.scrollTo({ top: document.body.scrollHeight, behavior: smooth ? "smooth" : "auto" });
}

function setStatus(mode, text) {
  statusEl.className = "status" + (mode === "live" ? " live" : mode === "err" ? " err" : "");
  statusText.textContent = text;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function stripMarkTags(s) {
  return String(s).replace(/<\/?mark[^>]*>/gi, "");
}

function formatBodyHtml(raw) {
  var cleaned = escapeHtml(stripMarkTags(raw || ""));
  cleaned = cleaned.replace(/(@(?:all|MUZI|Muse|Claude|Antigravity|Copilot|Grok|Taheed|Lena|OBS))\b/gi, '<span class="mention">$1</span>');
  cleaned = cleaned.replace(/\b(HOLD|BLOCKED)\b/g, '<span class="kw-hold">$1</span>');
  cleaned = cleaned.replace(/\b(VERIFY|NEEDS-WORK)\b/g, '<span class="kw-verify">$1</span>');
  cleaned = cleaned.replace(/\b(DONE|VERIFIED|PASSED)\b/g, '<span class="kw-done">$1</span>');
  return cleaned;
}

function canonicalAgent(author) {
  var a = String(author || "System").toLowerCase();
  if (a.indexOf("taheed") !== -1 || a.indexOf("tea") !== -1) return "Taheed";
  if (a.indexOf("muzi") !== -1 || a.indexOf("muse") !== -1) return "MUZI";
  if (a.indexOf("claude") !== -1) return "Claude";
  if (a.indexOf("antigravity") !== -1 || a.indexOf("agy") !== -1) return "Antigravity";
  if (a.indexOf("copilot") !== -1) return "Copilot";
  if (a.indexOf("hollemu") !== -1 || a.indexOf("dolphin") !== -1) return "hollemu";
  if (a.indexOf("grok") !== -1 || a.indexOf("lena") !== -1 || a.indexOf("obs") !== -1) return "Grok";
  return author || "System";
}

function agentColor(canon, fallback) {
  var map = {
    "Taheed": "#ffd166",
    "MUZI": "#e2e8f0",
    "Claude": "#fdba74",
    "Antigravity": "#86efac",
    "Copilot": "#93c5fd",
    "Grok": "#c4b5fd",
    "hollemu": "#67e8f9"
  };
  return map[canon] || fallback || "#9ca3af";
}

function isNoiseMsg(m) {
  var k = String(m.kind || "").toLowerCase();
  return k === "heartbeat" || k === "verbose_log";
}

function isTaskOrTaheedMsg(m) {
  var k = String(m.kind || "").toLowerCase();
  var canon = canonicalAgent(m.author);
  return canon === "Taheed" || k === "task" || k === "tasking" || k === "session" || (m.body && m.body.indexOf("@Taheed") !== -1);
}

function matchesSearchAndFilter(m) {
  if (selectedAgent && canonicalAgent(m.author) !== selectedAgent) return false;
  if (currentFilter === "clean" && isNoiseMsg(m)) return false;
  if (currentFilter === "tasks" && !isTaskOrTaheedMsg(m)) return false;
  var q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
  if (q) {
    var hay = ((m.author || "") + " " + (m.kind || "") + " " + (m.body || "")).toLowerCase();
    if (hay.indexOf(q) === -1) return false;
  }
  return true;
}

function timeAgo(iso) {
  if (!iso) return "";
  var sec = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (sec < 60) return sec + "s";
  var min = Math.floor(sec / 60);
  if (min < 60) return min + "m";
  var hr = Math.floor(min / 60);
  if (hr < 24) return hr + "h";
  return Math.floor(hr / 24) + "d";
}

function updatePresenceAndCounts() {
  var cleanCnt = 0, taskCnt = 0;
  var lastSeenByAgent = {};
  var order = ["Taheed", "MUZI", "Claude", "Antigravity", "Copilot", "Grok", "hollemu"];

  for (var i = 0; i < allMessages.length; i++) {
    var m = allMessages[i];
    if (!isNoiseMsg(m)) cleanCnt++;
    if (isTaskOrTaheedMsg(m)) taskCnt++;
    var c = canonicalAgent(m.author);
    if (!lastSeenByAgent[c] || m.created_at > lastSeenByAgent[c]) {
      lastSeenByAgent[c] = m.created_at;
    }
  }

  document.getElementById("cntClean").textContent = cleanCnt;
  document.getElementById("cntTasks").textContent = taskCnt;
  document.getElementById("cntAll").textContent = allMessages.length;

  var bar = document.getElementById("presenceBar");
  var html = "";
  for (var j = 0; j < order.length; j++) {
    var ag = order[j];
    var ts = lastSeenByAgent[ag];
    if (!ts && ag !== "Taheed" && ag !== "MUZI" && ag !== "Claude" && ag !== "Antigravity") continue;
    var recent = ts && ((Date.now() - new Date(ts).getTime()) < 30 * 60 * 1000);
    var sel = selectedAgent === ag ? " selected" : "";
    var onl = recent ? " online" : "";
    html += '<div class="agent-chip' + onl + sel + '" onclick="toggleAgentFilter(\'' + ag + '\')">' +
      '<span class="p-dot"></span>' +
      '<span style="color:' + agentColor(ag) + ';font-weight:600">' + escapeHtml(ag) + '</span>' +
      (ts ? '<span class="ago">' + timeAgo(ts) + '</span>' : '') +
      '</div>';
  }
  bar.innerHTML = html;

  var hint = document.getElementById("filterHint");
  hint.textContent = selectedAgent ? ("Filtered by @" + selectedAgent + " (tap chip to clear)") : "";
}

function toggleAgentFilter(ag) {
  selectedAgent = (selectedAgent === ag) ? null : ag;
  updatePresenceAndCounts();
  applyFilters();
}

function setFilter(f) {
  currentFilter = f;
  var tabs = document.querySelectorAll(".tab");
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle("active", tabs[i].getAttribute("data-filter") === f);
  }
  applyFilters();
}

function applyFilters() {
  var cards = thread.querySelectorAll(".msg");
  var visible = 0;
  for (var i = 0; i < cards.length; i++) {
    var id = cards[i].getAttribute("data-id");
    var msgObj = seenIds[id];
    var show = msgObj ? matchesSearchAndFilter(msgObj) : true;
    cards[i].style.display = show ? "block" : "none";
    if (show) visible++;
  }
  var empty = document.getElementById("empty");
  if (visible === 0 && allMessages.length > 0) {
    if (!empty) {
      empty = document.createElement("div");
      empty.id = "empty";
      thread.appendChild(empty);
    }
    empty.textContent = "No messages match the current filter.";
  } else if (empty && visible > 0) {
    empty.remove();
  }
}

function createMsgElement(m) {
  var div = document.createElement("div");
  var canon = canonicalAgent(m.author);
  var extraClass = canon === "Taheed" ? " taheed-msg" : "";
  div.className = "msg " + (m.kind || "message") + extraClass;
  div.setAttribute("data-id", m.id);

  var timeStr = "";
  try { timeStr = new Date(m.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}); } catch (e) {}
  var color = agentColor(canon, m.author_color);
  var authorLabel = (m.author_emoji ? m.author_emoji + " " : (canon === "Taheed" ? "👑 " : "")) + (m.author || "System");
  var bodyRaw = m.body || "";
  var isLong = bodyRaw.split("\n").length > 10 || bodyRaw.length > 750;

  div.innerHTML =
    '<div class="msg-head">' +
      '<div class="meta">' +
        '<span class="author" style="color:' + escapeHtml(color) + '" onclick="toggleAgentFilter(\'' + escapeHtml(canon) + '\')">' + escapeHtml(authorLabel) + '</span>' +
        '<span class="kind-pill">' + escapeHtml(m.kind || "message") + '</span>' +
        '<span>' + escapeHtml(timeStr) + ' · ' + escapeHtml(timeAgo(m.created_at)) + ' ago</span>' +
      '</div>' +
      '<div class="msg-actions">' +
        '<button class="act-btn" onclick="replyToMsg(\'' + escapeHtml(canon) + '\', \'' + escapeHtml(String(m.id)) + '\')">↩ Reply</button>' +
        '<button class="act-btn" onclick="copyMsg(\'' + escapeHtml(String(m.id)) + '\', this)">⧉ Copy</button>' +
      '</div>' +
    '</div>' +
    '<div class="body' + (isLong ? ' collapsed' : '') + '" id="body-' + escapeHtml(String(m.id)) + '">' + formatBodyHtml(bodyRaw) + '</div>' +
    (isLong ? '<button class="expand-btn" onclick="toggleExpand(\'' + escapeHtml(String(m.id)) + '\', this)">▾ Show full message</button>' : '');

  div.style.display = matchesSearchAndFilter(m) ? "block" : "none";
  return div;
}

function toggleExpand(id, btn) {
  var el = document.getElementById("body-" + id);
  if (!el) return;
  var collapsed = el.classList.toggle("collapsed");
  btn.textContent = collapsed ? "▾ Show full message" : "▴ Collapse";
}

function replyToMsg(agentName, id) {
  var prefix = "@" + agentName + " ";
  if (msgInput.value.indexOf(prefix) === -1) {
    msgInput.value = prefix + msgInput.value;
  }
  msgInput.focus();
}

function copyMsg(id, btn) {
  var m = seenIds[id];
  if (!m || !navigator.clipboard) return;
  navigator.clipboard.writeText(stripMarkTags(m.body || "")).then(function() {
    var old = btn.textContent;
    btn.textContent = "✓ Copied";
    setTimeout(function() { btn.textContent = old; }, 1200);
  });
}

function insertTag(tag) {
  var start = msgInput.selectionStart || msgInput.value.length;
  var val = msgInput.value;
  msgInput.value = val.slice(0, start) + tag + val.slice(start);
  msgInput.focus();
}

function renderMsg(m, stickToBottom) {
  if (!m || seenIds[m.id]) return;
  seenIds[m.id] = m;
  allMessages.push(m);
  var empty = document.getElementById("empty");
  if (empty) empty.remove();
  var el = createMsgElement(m);
  thread.appendChild(el);

  if (stickToBottom) {
    scrollToBottom(false);
  } else if (!isNoiseMsg(m)) {
    unreadWhileScrolled++;
    jumpBtn.textContent = "↓ " + unreadWhileScrolled + " new message" + (unreadWhileScrolled > 1 ? "s" : "");
    jumpBtn.style.display = "block";
  }
}

function apiUrl(since) {
  var url = SUPABASE_URL + "/rest/v1/bac_messages?select=*&order=created_at.desc&limit=200";
  if (since) {
    url = SUPABASE_URL + "/rest/v1/bac_messages?select=*&order=created_at.asc&limit=200&created_at=gt." + encodeURIComponent(since);
  }
  return url;
}

function fetchWithTimeout(url, ms) {
  return new Promise(function(resolve, reject) {
    var timer = setTimeout(function() { reject(new Error("request timed out")); }, ms);
    fetch(url, { headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY } })
      .then(function(res) {
        clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(resolve, reject);
  });
}

function loadInitial() {
  setStatus("", "connecting…");
  fetchWithTimeout(apiUrl(null), 15000).then(function(rows) {
    failCount = 0;
    rows.reverse();
    rows.forEach(function(m) {
      renderMsg(m, false);
      if (!lastCreatedAt || m.created_at > lastCreatedAt) lastCreatedAt = m.created_at;
    });
    updatePresenceAndCounts();
    applyFilters();
    scrollToBottom(false);
    setStatus("live", "live · 5s");
    schedulePoll();
  }).catch(function(e) {
    setStatus("err", "error: " + (e.message || "network"));
  });
}

function poll() {
  if (isPaused) return;
  fetchWithTimeout(apiUrl(lastCreatedAt), 15000).then(function(rows) {
    failCount = 0;
    var wasNearBottom = isNearBottom();
    var added = 0;
    rows.forEach(function(m) {
      if (!seenIds[m.id]) {
        added++;
        renderMsg(m, wasNearBottom);
      }
      if (!lastCreatedAt || m.created_at > lastCreatedAt) lastCreatedAt = m.created_at;
    });
    if (added > 0) updatePresenceAndCounts();
    setStatus("live", "live · 5s" + (added ? " (+" + added + ")" : ""));
    schedulePoll();
  }).catch(function() {
    failCount++;
    setStatus(failCount >= 3 ? "err" : "", failCount >= 3 ? "connection lost" : "reconnecting…");
    schedulePoll();
  });
}

function schedulePoll() {
  clearTimeout(pollTimer);
  if (!isPaused) pollTimer = setTimeout(poll, 5000);
}

function togglePause() {
  isPaused = !isPaused;
  var btn = document.getElementById("pauseBtn");
  btn.textContent = isPaused ? "▶ Resume" : "⏸ Pause";
  btn.classList.toggle("active", isPaused);
  if (isPaused) {
    clearTimeout(pollTimer);
    setStatus("", "paused");
  } else {
    poll();
  }
}

function manualRefresh() {
  clearTimeout(pollTimer);
  poll();
}

function sendMessage() {
  var text = (msgInput.value || "").trim();
  if (!text) return;
  var kind = document.getElementById("kindSelect").value || "message";
  sendBtn.disabled = true;
  sendStatus.textContent = "Sending to live thread…";

  var payload = {
    author: "Taheed",
    author_emoji: "👑",
    author_color: "#FFD166",
    kind: kind,
    body: text
  };

  fetch(WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(function(res) {
    if (!res.ok) throw new Error("Webhook returned HTTP " + res.status);
    msgInput.value = "";
    msgInput.style.height = "40px";
    sendStatus.textContent = "✓ Sent! Syncing feed…";
    sendBtn.disabled = false;
    setTimeout(function() {
      sendStatus.textContent = "Posting as 👑 Taheed · synced to Supabase & Lenovo BAC";
    }, 3000);
    manualRefresh();
  }).catch(function(err) {
    sendBtn.disabled = false;
    sendStatus.textContent = "⚠ Send failed: " + (err.message || "network error");
  });
}

msgInput.addEventListener("input", function() {
  this.style.height = "40px";
  this.style.height = Math.min(this.scrollHeight, 110) + "px";
});

msgInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

loadInitial();
</script>
</body>
</html>
